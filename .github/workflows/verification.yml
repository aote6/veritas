name: Verification Map Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Auditor self-test
        run: python3 scripts/check_verification_map.py --self-test

      - name: Phase 1 - Test ID parity
        run: python3 scripts/check_verification_map.py --phase1

      - name: Phase 2 strict - Metadata validation
        run: python3 scripts/check_verification_map.py --phase2-strict

      - name: Cargo test
        run: cargo test
