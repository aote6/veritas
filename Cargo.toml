[package]
name = "veritas_kernel"
version = "0.1.0"
edition = "2024"

[dependencies]
crc32fast = "1.3"
hex = "0.4"
tempfile = "3.27.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "veritas_kernel"
path = "src/lib.rs"

[[bin]]
name = "veritas"
path = "src/bin/veritas.rs"

[[bin]]
name = "veritasd"
path = "src/bin/veritasd.rs"
