[package]
name = "veritas_kernel"
version = "0.1.0"
edition = "2021"

[dependencies]
crc32fast = "1.3"
hex = "0.4"
tempfile = "=3.10.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
getrandom = "=0.2.15"
fastrand = "=2.1.0"
rustix = "=0.38.34"
bitflags = "=2.6.0"
linux-raw-sys = "=0.4.14"
cfg-if = "1.0"
errno = "0.3"
libc = "0.2"

[lib]
name = "veritas_kernel"
path = "src/lib.rs"

[[bin]]
name = "veritas"
path = "src/bin/veritas.rs"

[[bin]]
name = "veritasd"
path = "src/bin/veritasd.rs"
